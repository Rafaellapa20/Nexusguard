name: Build

# Confirma que o projeto compila em cada push e pull request.
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar o .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar
        run: dotnet build src/NexusGuard/NexusGuard.csproj -c Release --nologo

      - name: Publicar executável único
        run: ./build.ps1 -SelfContained
        shell: pwsh

      - name: Guardar o executável para inspeção
        uses: actions/upload-artifact@v4
        with:
          name: NexusGuard-${{ github.sha }}
          path: dist/NexusGuard.exe
          retention-days: 7
